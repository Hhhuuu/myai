name: Publish Telegram Draft

on:
  push:
    branches:
      - master
    paths:
      - telegram-draft.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate draft
        run: python scripts/validate_draft.py telegram-draft.md

      - name: Publish to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: python scripts/send_telegram.py telegram-draft.md

      - name: Archive published post
        run: python scripts/archive_post.py telegram-draft.md

      - name: Commit archive
        run: |
          git config user.name "telegram-publisher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: archive Telegram post $(date -u +%Y-%m-%d)"
            git push
          fi
